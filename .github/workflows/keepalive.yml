name: Keep Supabase awake

on:
  schedule:
    # Daily at 12:00 UTC. Free Supabase projects pause after about a week of no traffic.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Auth health
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "VITE_SUPABASE_URL is not set. Add it under repository variables."
            exit 1
          fi
          curl --fail --silent --show-error "$SUPABASE_URL/auth/v1/health"
          echo
